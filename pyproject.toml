[project]
name = "era-translator"
version = "0.1.0"
description = "Era Translator: DANN for cross-era NBA player normalization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.5",
    "matplotlib==3.11.1",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "seaborn==0.13.2",
    "torch==2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
    "ty==0.0.67",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
